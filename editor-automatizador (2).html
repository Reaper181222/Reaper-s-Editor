<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor + Automatizador de edits</title>
<style>
:root{--bg:#16181d;--p:#1f2229;--b:#343945;--t:#e8eaf0;--a:#6c8cff}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-rows:auto 1fr;background:var(--bg);color:var(--t);font:13px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--p);border-bottom:1px solid var(--b)}
#tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
main{display:grid;grid-template-columns:1fr 320px;min-height:0}
#view{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0d0e11;min-height:0}
canvas{background:#fff;box-shadow:0 0 0 1px #000,0 8px 30px #0008;touch-action:none}
aside{background:var(--p);border-left:1px solid var(--b);overflow:auto;padding:8px;min-height:0}
button,select,input,textarea{background:#2a2e38;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:5px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--a)}button.on{background:var(--a);color:#fff;border-color:var(--a)}
input[type=color]{padding:0;height:26px;width:44px}input[type=range]{padding:0}
.row{display:grid;grid-template-columns:105px 1fr;gap:6px;align-items:center;margin:4px 0}
h4{margin:12px 0 4px;color:#9aa3b8;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.layer{display:flex;gap:4px;align-items:center;padding:3px 4px;border:1px solid transparent;border-radius:6px;cursor:pointer}
.layer.sel{background:#2d3550;border-color:var(--a)}
.layer span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer button{padding:1px 6px}
textarea{width:100%;resize:vertical;font-size:12px;max-height:30vh;-webkit-user-select:text;user-select:text}
.hint{color:#8b93a7}details{margin:6px 0}summary{cursor:pointer;color:#9aa3b8}#gh button{margin:2px}#gh input:not([type=checkbox]){max-width:100%}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:50vh 1fr}aside{border-left:0;border-top:1px solid var(--b)}}
</style></head><body>
<header>
<button id="m1" class="on">✏️ Editor</button><button id="m2">⚡ Automatizar</button>
<span id="tools">
<button data-t="select" class="on">↖ Mover</button><button data-t="rect">▭ Forma</button><button data-t="text">T Texto</button><button id="ti">🖼 Imagen</button>
<input id="dw" type="number" value="1080" style="width:68px">×<input id="dh" type="number" value="1080" style="width:68px"><input id="bg" type="color" value="#ffffff" title="Fondo">
</span>
<span style="flex:1"></span>
<button id="un" title="Deshacer (Ctrl+Z)">↶</button><button id="re" title="Rehacer (Ctrl+Y)">↷</button><select id="fmt"><option value="png">PNG</option><option value="webp">WEBP</option><option value="jpg">JPG</option><option value="gif">GIF (animado)</option></select><input id="gw" type="number" value="480" title="Ancho máx. del GIF (px)" style="width:62px"><button id="pl" title="Reproducir / pausar GIFs">⏸</button><button id="lj">📂 Plantilla</button><button id="xj">💾 JSON</button><button id="xp">⬇ Exportar</button>
<input id="fi" type="file" accept="image/*" multiple hidden><input id="fj" type="file" accept=".json,application/json" hidden>
</header>
<main>
<div id="view"><canvas id="c" width="1080" height="1080"></canvas></div>
<aside>
<div id="editside"><div id="props"></div><h4>Capas</h4><div id="layers"></div>
<p class="hint">Elige Rectángulo o Texto y arrastra sobre el lienzo para dibujar el área. Supr borra la capa.</p></div>
<div id="auto" hidden></div>
<div id="gh"><h4>☁ GitHub</h4>
<details id="gc"><summary>Conexión (usuario, repo, token)</summary>
<div class="row"><label>Usuario</label><input id="gho"></div>
<div class="row"><label>Repositorio</label><input id="ghr"></div>
<div class="row"><label>Rama</label><input id="ghb" value="main"></div>
<div class="row"><label>Token</label><input id="ght" type="password" placeholder="solo para guardar/borrar"></div>
<label><input id="ghk" type="checkbox"> Recordar token en este navegador</label>
<p><button id="ghc">Conectar</button></p></details>
<p id="ghs" class="hint">Sin conectar</p>
<details open><summary>🔤 Fuentes (carpeta Fuentes)</summary><div id="lf"></div><button id="uf">⬆ Subir fuente…</button><input id="ff" type="file" accept=".ttf,.otf,.woff,.woff2" hidden></details>
<details open><summary>📄 Plantillas (carpeta Plantillas)</summary><div id="lp"></div><input id="pn" placeholder="nombre"><button id="sp">Guardar la actual</button></details>
<details open><summary>🎨 Estilos (carpeta Estilos)</summary><div id="ls"></div><input id="sn" placeholder="nombre del estilo"><button id="ss">Guardar de la capa</button></details>
</div>
</aside>
</main>
<script>
const $=s=>document.querySelector(s),cv=$('#c');let ctx=cv.getContext('2d');
let doc={w:1080,h:1080,bg:'#ffffff',layers:[]},sel=null,tool='select',mode='edit',drag=null,k=1,uid=1;
const FONTS=['Arial','Georgia','Impact','Times New Roman','Courier New','Verdana','Trebuchet MS','Comic Sans MS','Palatino','Brush Script MT'];
const ico={rect:'▭',text:'T',image:'🖼'},cur=()=>doc.layers.find(l=>l.id==sel);

/* ---------- capas ---------- */
function add(l){l=Object.assign({rot:0,opacity:1,eo:false,ec:'#000000',ed:12,ea:45,eb:12,eop:.6,io:false,ic:'#000000',ids:10,ia:45,ib:10,iop:.6,bv:0,bla:225},l);l.id=uid++;doc.layers.push(l);sel=l.id;ui();render();commit();return l}
const newRect=(x,y,w,h)=>add({type:'rect',name:'Forma '+uid,x,y,w,h,shape:'rect',sides:5,inner:.5,fill:'solid',c1:'#6c8cff',c2:'#ffffff',angle:45,size:20,gap:20,ps:6,rc:40,ri:30,rw:.5,radius:0,bw:0,bc:'#000000',nb:false,bf:'solid',bc2:'#ffffff',ba:45,bs:8,bp:8});
const newText=(x,y,w,h)=>add({type:'text',name:'Texto '+uid,x,y,w,h,text:'Texto de ejemplo',font:'Arial',size:80,bold:true,italic:false,color:'#111111',useGrad:false,color2:'#ff4d8d',gAngle:90,shadow:false,shColor:'#000000',shBlur:8,shX:4,shY:4,align:'center',valign:'middle',indent:0,lh:1.2,autofit:true,rs:[]});
const readFile=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
/* ---------- GIF: decodificador y codificador propios ---------- */
function lzwDec(min,data,n){const cl=1<<min,eoi=cl+1,out=new Uint8Array(n),pf=new Int16Array(4096),sf=new Uint8Array(4096),st=new Uint8Array(4097);
 let size=min+1,next=eoi+1,old=-1,first=0,op=0,ip=0,bits=0,nb=0;for(let i=0;i<cl;i++)sf[i]=i;
 while(op<n){while(nb<size&&ip<data.length){bits|=data[ip++]<<nb;nb+=8}if(nb<size)break;
  const code=bits&((1<<size)-1);bits>>=size;nb-=size;
  if(code==cl){size=min+1;next=eoi+1;old=-1;continue}if(code==eoi)break;
  if(old==-1){out[op++]=sf[code];old=code;first=code;continue}
  let c=code,sp=0;if(code>=next){st[sp++]=first;c=old}
  while(c>=cl){st[sp++]=sf[c];c=pf[c]}first=c;st[sp++]=c;while(sp&&op<n)out[op++]=st[--sp];
  if(next<4096){pf[next]=old;sf[next]=first;next++;if(next==(1<<size)&&size<12)size++}old=code}
 return out}
function gifDecode(b){let p=6;const W=b[p]|b[p+1]<<8,H=b[p+2]|b[p+3]<<8,f=b[p+4];p+=7;let gct=null;
 if(f&128){const n=3<<((f&7)+1);gct=b.subarray(p,p+n);p+=n}
 const cur=new Uint8ClampedArray(W*H*4),frames=[];let gc={d:10,t:-1,disp:0},prev=null,save=null;
 while(p<b.length){const t=b[p++];if(t==0x3B)break;
  if(t==0x21){const lb=b[p++];if(lb==0xF9){const q=b[p+1];gc={disp:q>>2&7,t:q&1?b[p+4]:-1,d:b[p+2]|b[p+3]<<8}}while(b[p])p+=b[p]+1;p++;continue}
  if(t!=0x2C)break;
  const x=b[p]|b[p+1]<<8,y=b[p+2]|b[p+3]<<8,w=b[p+4]|b[p+5]<<8,h=b[p+6]|b[p+7]<<8,fl=b[p+8];p+=9;let ct=gct;
  if(fl&128){const n=3<<((fl&7)+1);ct=b.subarray(p,p+n);p+=n}
  const min=b[p++],parts=[];while(b[p]){parts.push(b.subarray(p+1,p+1+b[p]));p+=b[p]+1}p++;
  const data=new Uint8Array(parts.reduce((a,c)=>a+c.length,0));let q=0;for(const c of parts){data.set(c,q);q+=c.length}
  const idx=lzwDec(min,data,w*h),rows=[];
  if(fl&64){for(const[s,st]of[[0,8],[4,8],[2,4],[1,2]])for(let r=s;r<h;r+=st)rows.push(r)}else for(let r=0;r<h;r++)rows.push(r);
  if(prev){if(prev.disp==2){for(let r=0;r<prev.h;r++)for(let c=0;c<prev.w;c++){const o=((prev.y+r)*W+prev.x+c)*4;if(o>=0&&o<cur.length)cur.fill(0,o,o+4)}}else if(prev.disp==3&&save)cur.set(save)}
  if(gc.disp==3)save=cur.slice();
  for(let i=0;i<w*h;i++){const v=idx[i];if(v==gc.t)continue;const X=x+i%w,Y=y+rows[i/w|0];if(X>=W||Y>=H)continue;const o=(Y*W+X)*4;cur[o]=ct[v*3];cur[o+1]=ct[v*3+1];cur[o+2]=ct[v*3+2];cur[o+3]=255}
  frames.push({data:cur.slice(),d:gc.d<2?100:gc.d*10});prev={disp:gc.disp,x,y,w,h};gc={d:10,t:-1,disp:0}}
 return{W,H,frames}}
function gifPalette(hist,n){const ch=c=>[c>>10&31,c>>5&31,c&31],cols=[];for(let i=0;i<32768;i++)if(hist[i])cols.push(i);
 const boxes=[cols];
 while(boxes.length<n){let bi=-1,bs=0;boxes.forEach((b,i)=>{if(b.length>1){const s=b.reduce((a,c)=>a+hist[c],0);if(s>bs){bs=s;bi=i}}});if(bi<0)break;
  const b=boxes[bi],mn=[31,31,31],mx=[0,0,0];for(const c of b){const v=ch(c);for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],v[k]);mx[k]=Math.max(mx[k],v[k])}}
  const k=[0,1,2].sort((a,c)=>(mx[c]-mn[c])-(mx[a]-mn[a]))[0];b.sort((a,c)=>ch(a)[k]-ch(c)[k]);
  let acc=0,i=0;for(;i<b.length-2;i++){acc+=hist[b[i]];if(acc>=bs/2)break}
  boxes.splice(bi,1,b.slice(0,i+1),b.slice(i+1))}
 return boxes.map(b=>{let r=0,g=0,l=0,t=0;for(const c of b){const w=hist[c];r+=(c>>10&31)*w;g+=(c>>5&31)*w;l+=(c&31)*w;t+=w}return[r,g,l].map(v=>Math.round(v/t*255/31))})}
function lzwEnc(idx){const out=[];let bits=0,nb=0;const emit=(c,s)=>{bits|=c<<nb;nb+=s;while(nb>=8){out.push(bits&255);bits>>=8;nb-=8}};
 let size=9,next=258,dict=new Map(),pre=idx[0];emit(256,size);
 for(let i=1;i<idx.length;i++){const c=idx[i],k=pre<<8|c,v=dict.get(k);
  if(v!==undefined){pre=v;continue}
  emit(pre,size);if(next<4096){dict.set(k,next++);if(next>(1<<size)&&size<12)size++}else{emit(256,size);dict.clear();size=9;next=258}pre=c}
 emit(pre,size);emit(257,size);if(nb)out.push(bits&255);return out}
function gifEncode(W,H,fr){const hist=new Uint32Array(32768),key=(d,i)=>(d[i]>>3)<<10|(d[i+1]>>3)<<5|d[i+2]>>3;
 for(const f of fr){const d=f.data;for(let i=0;i<d.length;i+=4)hist[key(d,i)]++}
 const pal=gifPalette(hist,256),lut=new Int16Array(32768).fill(-1);
 const near=c=>{const r=(c>>10&31)*255/31,g=(c>>5&31)*255/31,b=(c&31)*255/31;let bi=0,bd=1e9;pal.forEach((p,i)=>{const e=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(e<bd){bd=e;bi=i}});return bi};
 const o=[...'GIF89a'].map(c=>c.charCodeAt(0)),w16=v=>o.push(v&255,v>>8&255);
 w16(W);w16(H);o.push(0xF7,0,0);for(let i=0;i<256;i++)o.push(...(pal[i]||[0,0,0]));
 o.push(0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
 for(const f of fr){const d=f.data,ix=new Uint8Array(W*H);for(let i=0,j=0;i<d.length;i+=4,j++){const k=key(d,i);let v=lut[k];if(v<0)v=lut[k]=near(k);ix[j]=v}
  o.push(0x21,0xF9,4,4);w16(Math.max(2,Math.round(f.delay/10)));o.push(0,0);
  o.push(0x2C);w16(0);w16(0);w16(W);w16(H);o.push(0,8);
  const z=lzwEnc(ix);for(let i=0;i<z.length;i+=255){const c=z.slice(i,i+255);o.push(c.length,...c)}o.push(0)}
 o.push(0x3B);return new Uint8Array(o)}

/* ---------- GIFs animados: carga, reproducción y exportación ---------- */
let GT=0,play=true;
const IMG=new Map(),dim=i=>[i.naturalWidth||i.width,i.naturalHeight||i.height];
function getImg(src,cb){const c=IMG.get(src);if(c)return cb(c);const fin=e=>{IMG.set(src,e);cb(e)};
 if(/^data:image\/gif/.test(src)){try{const g=gifDecode(Uint8Array.from(atob(src.split(',')[1]),c=>c.charCodeAt(0)));
  const f=g.frames.map(x=>{const c=document.createElement('canvas');c.width=g.W;c.height=g.H;c.getContext('2d').putImageData(new ImageData(x.data,g.W,g.H),0,0);return{c,d:x.d}});
  return fin({i:f[0].c,f:f.length>1?f:null})}catch(e){}}
 const i=new Image();i.onload=()=>fin({i});i.src=src}
function loadImg(l,src){getImg(src,e=>{l._img=e.i;l._gf=e.f||null;l.src=src;const[iw,ih]=dim(e.i);
  if(l._fresh){const s=Math.min(1,doc.w*.6/iw,doc.h*.6/ih);l.w=iw*s;l.h=ih*s;l.x=(doc.w-l.w)/2;l.y=(doc.h-l.h)/2;Object.assign(l,{u:0,v:0,cw:l.w,ch:l.h});delete l._fresh;ui()}
  else if(l._refit||l.cw==null){fitContent(l,l.fit||'cover');delete l._refit}render()});
 if(l.mk)getImg(l.mk,e=>{l._mi=e.i;l._mg=e.f||null;render()})}
function fitContent(l,m){const i=l._img;if(!i)return;const[iw,ih]=dim(i),sx=l.w/iw,sy=l.h/ih,s=m=='contain'?Math.min(sx,sy):Math.max(sx,sy);l.fit=m;l.cw=m=='stretch'?l.w:iw*s;l.ch=m=='stretch'?l.h:ih*s;l.u=(l.w-l.cw)/2;l.v=(l.h-l.ch)/2}
function gifFrame(f){const tot=f.reduce((a,x)=>a+x.d,0);let t=GT%tot;for(const x of f){if(t<x.d)return x.c;t-=x.d}return f[0].c}
(function tick(t){if(play&&doc.layers.some(l=>(l._gf||l._mg)&&!l.hidden)){GT=t;render()}requestAnimationFrame(tick)})(0);
$('#pl').onclick=()=>{play=!play;$('#pl').textContent=play?'⏸':'▶'};
async function exportGif(){const was=play,b=$('#xp');play=false;
 try{const gl=doc.layers.filter(l=>!l.hidden).flatMap(l=>[l._gf,l._mg].filter(Boolean)),tot=f=>f.reduce((a,x)=>a+x.d,0);
  const D=gl.length?Math.max(...gl.map(tot)):100,md=gl.length?Math.min(...gl.flatMap(f=>f.map(x=>x.d))):100;
  const N=gl.length?Math.min(120,Math.max(1,Math.ceil(D/Math.max(20,md)))):1,step=D/N;
  const sw=Math.min(doc.w,Math.max(16,+$('#gw').value||480)),sh=Math.round(doc.h*sw/doc.w),sc=document.createElement('canvas');sc.width=sw;sc.height=sh;
  const sx=sc.getContext('2d'),fr=[];
  for(let i=0;i<N;i++){GT=i*step;render(true);sx.drawImage(cv,0,0,sw,sh);fr.push({data:sx.getImageData(0,0,sw,sh).data,delay:step});b.textContent='⏳ '+(i+1)+'/'+N;await new Promise(r=>setTimeout(r))}
  b.textContent='⏳ Codificando…';await new Promise(r=>setTimeout(r,30));
  dl(new Blob([gifEncode(sw,sh,fr)],{type:'image/gif'}),'edit.gif')}
 finally{b.textContent='⬇ Exportar';play=was;render()}}
const addImg=f=>readFile(f,src=>{const l=add({type:'image',name:'Imagen '+uid,x:0,y:0,w:200,h:200,u:0,v:0,cw:200,ch:200,im:'put',fit:'cover',mf:'contain',mz:1,mx:0,my:0,_fresh:1});loadImg(l,src)});
function del(id){doc.layers=doc.layers.filter(l=>l.id!=id);if(sel==id)sel=null;ui();render();commit()}
function mv(l,d){const i=doc.layers.indexOf(l),j=i+d;if(j<0||j>=doc.layers.length)return;[doc.layers[i],doc.layers[j]]=[doc.layers[j],doc.layers[i]];ui();render();commit()}

/* ---------- dibujo ---------- */
function grad(x,y,w,h,a,c1,c2){const r=a*Math.PI/180,co=Math.cos(r),si=Math.sin(r),hl=(Math.abs(w*co)+Math.abs(h*si))/2,cx=x+w/2,cy=y+h/2;const g=ctx.createLinearGradient(cx-co*hl,cy-si*hl,cx+co*hl,cy+si*hl);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function path(l){ctx.beginPath();const{x,y,w,h}=l,cx=x+w/2,cy=y+h/2,n=l.sides||5;
 if(l.shape=='ellipse')ctx.ellipse(cx,cy,w/2,h/2,0,0,7);
 else if(l.shape=='poly'||l.shape=='star'){const m=l.shape=='star'?n*2:n;for(let i=0;i<m;i++){const a=-Math.PI/2+i*2*Math.PI/m,r=l.shape=='star'&&i%2?l.inner:1;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*w/2*r,cy+Math.sin(a)*h/2*r)}ctx.closePath()}
 else ctx.roundRect(x,y,w,h,l.radius||0)}
function bstyle(l){const bs=l.bs||8,bp=l.bp==null?8:l.bp,a=l.ba==null?45:l.ba,c2=l.bc2||'#ffffff';
 if(l.bf=='gradient')return grad(l.x,l.y,l.w,l.h,a,l.bc,c2);
 if(l.bf=='stripes'||l.bf=='dots'){const q=Math.max(2,bs+bp),c=document.createElement('canvas');c.width=c.height=q;const t=c.getContext('2d');t.fillStyle=l.bc;t.fillRect(0,0,q,q);t.fillStyle=c2;
  if(l.bf=='stripes')t.fillRect(0,0,bs,q);else{t.beginPath();t.arc(q/2,q/2,bs/2,0,7);t.fill()}
  const pt=ctx.createPattern(c,'repeat');pt.setTransform(new DOMMatrix().rotate(a));return pt}
 return l.bc}
function dRect(l){path(l);
 if(l.fill=='gradient'){ctx.fillStyle=grad(l.x,l.y,l.w,l.h,l.angle,l.c1,l.c2);ctx.fill()}
 else{if(l.fill!='none'&&!l.nb){ctx.fillStyle=l.c1;ctx.fill()}
  if(l.fill!='solid'&&l.fill!='none'){ctx.save();ctx.clip();ctx.fillStyle=l.c2;const p=Math.max(1,l.size+l.gap);
   if(l.fill=='stripes'){const D=Math.hypot(l.w,l.h);ctx.translate(l.x+l.w/2,l.y+l.h/2);ctx.rotate(l.angle*Math.PI/180);for(let u=-D/2;u<D/2;u+=p)ctx.fillRect(u,-D/2,l.size,D)}
   else if(l.fill=='dots'){const r=l.size/2;for(let y=l.y;y<l.y+l.h;y+=p)for(let x=l.x;x<l.x+l.w;x+=p){ctx.beginPath();ctx.arc(x+r,y+r,r,0,7);ctx.fill()}}
   else if(l.fill=='hex'){const R=l.size/2,pw=l.size+l.gap,ph=Math.max(1,pw*(l.ps==6?.866:1));let r=0;for(let y=l.y-ph;y<l.y+l.h+ph;y+=ph,r++)for(let x=l.x-pw+(r%2?pw/2:0);x<l.x+l.w+pw;x+=pw){ctx.beginPath();for(let i=0;i<l.ps;i++){const a=-Math.PI/2+i*2*Math.PI/l.ps;ctx[i?'lineTo':'moveTo'](x+R+Math.cos(a)*R,y+R+Math.sin(a)*R)}ctx.closePath();ctx.fill()}}
   else if(l.fill=='rays'){const D=Math.hypot(l.w,l.h),cx=l.x+l.w/2,cy=l.y+l.h/2;for(let i=0;i<l.rc;i++){const f=Math.abs(Math.sin(i*12.9898)*43758.5453%1),a=(i+f*.6)*2*Math.PI/l.rc,hw=Math.PI/l.rc*l.rw*(.4+f*.6);ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*l.ri,cy+Math.sin(a)*l.ri);ctx.lineTo(cx+Math.cos(a-hw)*D,cy+Math.sin(a-hw)*D);ctx.lineTo(cx+Math.cos(a+hw)*D,cy+Math.sin(a+hw)*D);ctx.fill()}}

  F('u','Contenido X','range',{...R(-3000,3000,1),s:l=>l.im=='adj'}),F('v','Contenido Y','range',{...R(-3000,3000,1),s:l=>l.im=='adj'}),
  F('cw','Contenido ancho','num',{s:l=>l.im=='adj'}),F('ch','Contenido alto','num',{s:l=>l.im=='adj'}),
  F('fit','Reajustar contenido','sel',{o:[['cover','Llenar (recorta)'],['contain','Contener'],['stretch','Estirar']],fn:l=>fitContent(l,l.fit)}),

function buildProps(){const P=$('#props'),l=cur();P.innerHTML='';
 if(!l){P.innerHTML='<p class="hint">Selecciona o crea una capa.</p>';return}
 for(const f of[...S.common,...S[l.type],...S.fx]){if(f.s&&!f.s(l))continue;
  const r=document.createElement('div');r.className='row';r.innerHTML='<label>'+f.l+'</label>';let el;
  if(f.t=='sel'){el=document.createElement('select');f.o.forEach(([v,t])=>el.add(new Option(t,v)))}
  else if(f.t=='area'){el=document.createElement('textarea');el.rows=4;['select','keyup','mouseup','touchend','blur'].forEach(v=>el.addEventListener(v,()=>{SEL=[el.selectionStart,el.selectionEnd];PK&&PK()}))}
  else{el=document.createElement('input');el.type={num:'number',chk:'checkbox'}[f.t]||f.t;if(f.t=='range'){el.min=f.min;el.max=f.max;el.step=f.step}if(/^(x|y|w|h|u|v|cw|ch|rot)$/.test(f.k))el.dataset.k=f.k}
  f.t=='chk'?el.checked=!!l[f.k]:el.value=l[f.k];
  el.oninput=()=>{if(f.k=='text')fixRuns(l,l.text,el.value);l[f.k]=f.t=='chk'?el.checked:(f.t=='num'||f.t=='range')?+el.value:el.value;if(f.fn)f.fn(l);render();if(f.k=='text'&&PK)PK();if(f.t=='sel'||f.t=='chk')buildProps();if(f.k=='name')layersUI()};
  r.append(el);P.append(r)}
 if(l.type=='text')selPanel(P,l);
 {const r=document.createElement('div');r.className='row';r.innerHTML='<label>Mover (Shift = 10px)</label>';const g=document.createElement('div');
  [['◀',-1,0],['▲',0,-1],['▼',0,1],['▶',1,0]].forEach(([t,dx,dy])=>{const b=document.createElement('button');b.textContent=t;b.onclick=e=>nudge(dx*(e.shiftKey?10:1),dy*(e.shiftKey?10:1));g.append(b)});r.append(g);P.append(r)}
 if(l.type=='image'){const b=document.createElement('button');b.textContent='Reemplazar imagen';b.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>readFile(i.files[0],s=>{l._refit=1;loadImg(l,s)});i.click()};P.append(b);
  const m=document.createElement('button');m.textContent=l.mk?'Cambiar marco (PNG/GIF)…':'🖼 Marco (PNG/GIF)…';
  m.onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='image/png,image/gif,image/webp,image/svg+xml';i.onchange=()=>readFile(i.files[0],s=>{l.mk=s;getImg(s,e=>{l._mi=e.i;l._mg=e.f||null;render();buildProps();commit()})});i.click()};P.append(m);
  if(l.mk){const q=document.createElement('button');q.textContent='Quitar marco';q.onclick=()=>{delete l.mk;l._mi=null;l._mg=null;render();buildProps();commit()};P.append(q)}}}
function layersUI(){const L=$('#layers');L.innerHTML='';
 [...doc.layers].reverse().forEach(l=>{const d=document.createElement('div');d.className='layer'+(l.id==sel?' sel':'');
  const s=document.createElement('span');s.textContent=ico[l.type]+' '+l.name;d.append(s);
  const b=(t,fn)=>{const x=document.createElement('button');x.textContent=t;x.onclick=e=>{e.stopPropagation();fn()};d.append(x)};
  b(l.hidden?'🚫':'👁',()=>{l.hidden=!l.hidden;ui();render()});b('↑',()=>mv(l,1));b('↓',()=>mv(l,-1));b('🗑',()=>del(l.id));
  d.onclick=()=>{sel=l.id;ui();render()};L.append(d)})}

/* ---------- automatizador ---------- */
function autoUI(){const A=$('#auto');A.innerHTML='';
 const T=doc.layers.filter(l=>l.type=='text'),I=doc.layers.filter(l=>l.type=='image');
 if(!T.length&&!I.length){A.innerHTML='<p class="hint">Esta plantilla no tiene textos ni imágenes. Crea algunos en el Editor o carga una plantilla (📂).</p>';return}
 A.insertAdjacentHTML('beforeend','<p class="hint">Escribe los textos: se ajustan solos al rectángulo de cada uno.</p>');
 if(T.length)A.insertAdjacentHTML('beforeend','<h4>Textos</h4>');
 T.forEach(l=>{const lb=document.createElement('label');lb.textContent=l.name;const ta=document.createElement('textarea');ta.rows=3;ta.value=l.text;ta.oninput=()=>{fixRuns(l,l.text,ta.value);l.text=ta.value;render()};A.append(lb,ta)});
 if(I.length)A.insertAdjacentHTML('beforeend','<h4>Imágenes</h4>');
 I.forEach(l=>{const r=document.createElement('div');r.className='row';r.innerHTML='<label>'+ico.image+' '+l.name.replace(/[<&>]/g,'')+'</label>';
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>i.files[0]&&readFile(i.files[0],s=>{l._refit=1;loadImg(l,s)});r.append(i);A.append(r)})}

/* ---------- barra superior ---------- */
function ui(){buildProps();layersUI();autoUI()}
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t))}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
function setMode(m){mode=m;$('#m1').classList.toggle('on',m=='edit');$('#m2').classList.toggle('on',m=='auto');
 $('#tools').hidden=$('#editside').hidden=m!='edit';$('#auto').hidden=m!='auto';drag=null;fitView();render()}
$('#m1').onclick=()=>setMode('edit');$('#m2').onclick=()=>setMode('auto');
$('#ti').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{[...e.target.files].forEach(addImg);e.target.value=''};
$('#dw').onchange=e=>{doc.w=Math.min(8000,Math.max(50,+e.target.value||1080));render()};
$('#dh').onchange=e=>{doc.h=Math.min(8000,Math.max(50,+e.target.value||1080));render()};
$('#bg').oninput=e=>{doc.bg=e.target.value;render()};
const dl=(blob,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)};
$('#xj').onclick=()=>dl(new Blob([JSON.stringify(doc,(k,v)=>k[0]=='_'?undefined:v)],{type:'application/json'}),'plantilla.json');
$('#xp').onclick=()=>{const f=$('#fmt').value;if(f=='gif')return exportGif();render(true);cv.toBlob(b=>{dl(b,'edit.'+f);render()},'image/'+(f=='jpg'?'jpeg':f),.95)};
$('#lj').onclick=()=>$('#fj').click();
$('#fj').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{doc=JSON.parse(r.result);uid=Math.max(0,...doc.layers.map(l=>l.id))+1;sel=null;
  $('#dw').value=doc.w;$('#dh').value=doc.h;$('#bg').value=doc.bg;
  doc.layers.forEach(l=>l.type=='image'&&l.src&&loadImg(l,l.src));ui();render();H=[];hi=-1;commit()}catch(x){alert('JSON de plantilla no válido')}};
 r.readAsText(f);e.target.value=''};
/* ---------- deshacer / rehacer ---------- */
const SR=[];let H=[],hi=-1;
const key=s=>{const i=SR.indexOf(s);return i<0?SR.push(s)-1:i};
const snap=()=>JSON.stringify(doc,(k,v)=>(k=='src'||k=='mk')?key(v):k[0]=='_'?undefined:v);
function commit(){const s=snap();if(H[hi]==s)return;H=H.slice(0,hi+1);H.push(s);if(H.length>80)H.shift();hi=H.length-1}
function go(d){const j=hi+d;if(j<0||j>=H.length)return;hi=j;doc=JSON.parse(H[j],(k,v)=>(k=='src'||k=='mk')?SR[v]:v);if(!cur())sel=null;
 $('#dw').value=doc.w;$('#dh').value=doc.h;$('#bg').value=doc.bg;doc.layers.forEach(l=>l.type=='image'&&l.src&&loadImg(l,l.src));ui();render()}
$('#un').onclick=()=>go(-1);$('#re').onclick=()=>go(1);
addEventListener('change',()=>commit());
fitView();ui();render();commit();
/* ---------- GitHub: Fuentes / Plantillas / Estilos ---------- */
const GH={o:'',r:'',b:'main',t:''};
try{Object.assign(GH,JSON.parse(localStorage.gh||'{}'))}catch(e){}
['o','r','b','t'].forEach(c=>{const el=$('#gh'+c);el.value=GH[c]||'';el.oninput=()=>GH[c]=el.value.trim()});
$('#ghk').checked=!!GH.t;
const say=m=>$('#ghs').textContent=m;
async function run(f){try{say('Trabajando…');await f();say('✔ Listo')}catch(e){say('⚠ '+(e.message||e))}}
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const gh=async(p,o={})=>{if(!GH.o||!GH.r)throw Error('Falta usuario o repositorio (Conexión)');
 return fetch(`https://api.github.com/repos/${GH.o}/${GH.r}/contents/${enc(p)}`+(o.method?'':'?ref='+encodeURIComponent(GH.b||'main')),{method:o.method,body:o.body&&JSON.stringify(o.body),headers:{Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(GH.t&&{Authorization:'Bearer '+GH.t})}})};
async function ghList(d){const r=await gh(d);if(r.status==404)return[];if(!r.ok)throw Error('GitHub '+r.status+' (revisa usuario/repo/rama)');return(await r.json()).filter(f=>f.type=='file')}
async function ghGet(p,bin){const r=await gh(p,{raw:1});if(!r.ok)throw Error('GitHub '+r.status);return bin?r.arrayBuffer():r.text()}
async function ghPut(p,content){const m=await gh(p),sha=m.ok?(await m.json()).sha:undefined;
 const r=await gh(p,{method:'PUT',body:{message:'Editor: '+p,content,branch:GH.b||'main',sha}});
 if(!r.ok)throw Error('GitHub '+r.status+' — '+((await r.json()).message||'¿token con permiso Contents: Read and write?'))}
async function ghDel(f){const r=await gh(f.path,{method:'DELETE',body:{message:'Editor: borrar '+f.path,sha:f.sha,branch:GH.b||'main'}});
 if(!r.ok)throw Error('GitHub '+r.status+' — hace falta token con permiso de escritura')}
const b64=s=>btoa(unescape(encodeURIComponent(s))),nm=f=>f.replace(/\.[^.]+$/,''),clean=s=>s.replace(/[^\w\- áéíóúñÁÉÍÓÚÑ]/g,'').trim()||'sin-nombre';
function loadDoc(t){doc=JSON.parse(t);uid=Math.max(0,...doc.layers.map(l=>l.id))+1;sel=null;$('#dw').value=doc.w;$('#dh').value=doc.h;$('#bg').value=doc.bg;
 doc.layers.forEach(l=>l.type=='image'&&l.src&&loadImg(l,l.src));ui();render();H=[];hi=-1;commit()}

const allow=t=>[...FXK,...STK[t]];
const LF=new Set();
async function loadFonts(fs){for(const f of fs){const n=nm(f.name);if(LF.has(n))continue;LF.add(n);
 try{const ff=new FontFace(n,await ghGet(f.path,1));await ff.load();document.fonts.add(ff);if(!FONTS.includes(n))FONTS.push(n)}catch(e){LF.delete(n)}}
 buildProps();render()}
function listUI(el,files,label,use){el.innerHTML=files.length?'':'<p class="hint">Vacío</p>';
 files.forEach(f=>{const d=document.createElement('div');d.className='layer';const sp=document.createElement('span');sp.textContent=nm(f.name);d.append(sp);
  const b=(t,fn)=>{const x=document.createElement('button');x.textContent=t;x.onclick=()=>run(fn);d.append(x)};
  b(label,()=>use(f));b('🗑',async()=>{if(confirm('¿Borrar '+f.name+' de GitHub?')){await ghDel(f);await refresh()}});el.append(d)})}
async function refresh(){const[a,b,c]=await Promise.all([ghList('Fuentes'),ghList('Plantillas'),ghList('Estilos')]);
 listUI($('#lf'),a,'Usar',async f=>{const l=cur();if(!l||l.type!='text')throw Error('Selecciona una capa de texto');l.font=nm(f.name);buildProps();render();commit()});
